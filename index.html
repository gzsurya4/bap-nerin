const clean = o => { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; };
const DB = {
  async list(col, fl = []) {
    if (IS_PREVIEW) return Object.entries(MEM[col] || {}).map(([id, d]) => ({ ...clone(d), id })).filter(r => fl.every(([f, , v]) => r[f] === v));
    const { fs, db } = fb;
    const s = await fs.getDocs(fs.query(fs.collection(db, col), ...fl.map(([f, o, v]) => fs.where(f, o, v))));
    return s.docs.map(d => ({ ...d.data(), id: d.id }));
  },
  async get(col, id) {
    if (IS_PREVIEW) { const d = (MEM[col] || {})[id]; return d ? { ...clone(d), id } : null; }
    const { fs, db } = fb; const s = await fs.getDoc(fs.doc(db, col, id));
    return s.exists() ? { ...s.data(), id: s.id } : null;
  },
  async set(col, id, data) {
    const c = clean(data);
    if (IS_PREVIEW) { (MEM[col] = MEM[col] || {})[id] = c; return id; }
    await fb.fs.setDoc(fb.fs.doc(fb.db, col, id), c); return id;
  },
  async add(col, data) {
    const id = IS_PREVIEW ? uid() : fb.fs.doc(fb.fs.collection(fb.db, col)).id;
    return DB.set(col, id, data);
  },
  async update(col, id, data) {
    const c = clean(data);
    if (IS_PREVIEW) { if (MEM[col] && MEM[col][id]) Object.assign(MEM[col][id], c); return; }
    await fb.fs.updateDoc(fb.fs.doc(fb.db, col, id), c);
  },
  async del(col, id) {
    if (IS_PREVIEW) { if (MEM[col]) delete MEM[col][id]; return; }
    await fb.fs.deleteDoc(fb.fs.doc(fb.db, col, id));
  },
  async setMany(col, items) {
    const ids = [];
    if (IS_PREVIEW) { for (const it of items) ids.push(await DB.set(col, it.id || uid(), it.data)); return ids; }
    const { fs, db } = fb;
    for (let i = 0; i < items.length; i += 400) {
      const b = fs.writeBatch(db);
      items.slice(i, i + 400).forEach(it => { const ref = it.id ? fs.doc(db, col, it.id) : fs.doc(fs.collection(db, col)); ids.push(ref.id); b.set(ref, clean(it.data)); });
      await b.commit();
    }
    return ids;
  }
};

async function hashPw(pw, salt) {
  if (IS_PREVIEW) return 'preview:' + pw; // mode uji coba: data hanya di memori, tidak butuh kriptografi (jalan di HTTP maupun HTTPS)
  if (!(window.crypto && crypto.subtle)) throw new Error('Browser tidak mendukung enkripsi. Buka aplikasi lewat HTTPS.');
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: 120000 }, k, 256);
  return b64(new Uint8Array(bits));
}
const newSalt = () => (IS_PREVIEW ? 'preview' : b64(crypto.getRandomValues(new Uint8Array(16))));
const USER_RE = /^[a-z0-9._-]{3,30}$/;

async function loginAdmin(email, pw) {
  email = String(email || '').trim();
  if (IS_PREVIEW) {
    if (email.toLowerCase() === 'admin@demo.sch' && pw === 'admin123') { S.user = { role: 'admin', id: 'demo', nama: 'Admin Demo', email }; return; }
    throw new Error('Email atau password salah.');
  }
  const c = await fb.authM.signInWithEmailAndPassword(fb.auth, email, pw);
  S.user = { role: 'admin', id: c.user.uid, nama: c.user.displayName || c.user.email, email: c.user.email };
}
async function loginRuang(username, pw) {
  const id = String(username || '').trim().toLowerCase();
  if (!id || !pw) throw new Error('Isi username dan password.');
  if (!USER_RE.test(id)) throw new Error('Username atau password salah.');
  const acc = await DB.get('akunRuang', id);
  if (!acc || acc.aktif === false || !acc.salt) throw new Error('Username atau password salah.');
  const h = await hashPw(pw, acc.salt);
  if (h !== acc.hash) throw new Error('Username atau password salah.');
  S.user = { role: 'ruang', id, ruangId: acc.ruangId, nama: acc.ruangNama };
}
const authMsg = e => {
  const c = e && e.code ? e.code : '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Email atau password salah.';
  if (/too-many/.test(c)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if (/network/.test(c)) return 'Tidak ada koneksi internet.';
  if (/permission-denied/.test(String(e && e.message))) return 'Akses ditolak oleh Security Rules Firestore. Periksa pengaturan rules.';
  return (e && e.message) || 'Terjadi kesalahan.';
};

function absenRows(date) {
  const m = new Map();
  S.data.bap.filter(b => b.tanggal === date).forEach(b => (b.kehadiran || []).forEach(r => {
    if (r.status === 'H') return;
    let x = m.get(r.siswaId);
    if (!x) { x = { siswaId: r.siswaId, nis: r.nis, nama: r.nama, kelas: r.kelas, ruang: b.ruangNama, items: [] }; m.set(r.siswaId, x); }
    x.items.push({ jamKe: b.jamKe, mapel: b.mapelNama, status: r.status, ket: r.ket });
  }));
  const rows = [...m.values()];
  rows.forEach(x => x.items.sort((a, b) => (a.jamKe || 0) - (b.jamKe || 0)));
  rows.sort((a, b) => byName(a.kelas, b.kelas) || byName(a.nama, b.nama));
  return rows;
}
const itemTxt = i => `${i.jamKe ? 'Jam ' + i.jamKe + ' ' : ''}${i.mapel}: ${LBL[i.status]}${i.ket ? ' (' + i.ket + ')' : ''}`;
const dOpen = (key, def) => (key in S.ui.dopen ? S.ui.dopen[key] : def);
function absenList(rows) {
  if (!rows.length) return empty('Tidak ada siswa yang tercatat tidak hadir pada tanggal ini.');
  const g = new Map(); rows.forEach(r => { if (!g.has(r.kelas)) g.set(r.kelas, []); g.get(r.kelas).push(r); });
  const def = rows.length <= 10;
  return [...g.entries()].map(([k, list]) => {
    const key = 'abs:' + k, open = dOpen(key, def);
    return `<div class="card grp"><button type="button" class="gh acc" data-act="dtoggle" data-v="${esc(key)}" data-d="${def ? 1 : 0}" aria-expanded="${open}"><span class="accl"><b>Kelas ${esc(k)}</b><small>${list.length} siswa tidak hadir</small></span><span class="accr"><span class="chev ${open ? 'up' : ''}">${ic('chev', 18)}</span></span></button>${open ? list.map((r, n) => `<div class="srow"><span class="sno">${n + 1}</span><div class="sinfo"><b>${esc(r.nama)}</b><small>${esc(r.nis)} · ${esc(r.ruang)}</small></div><div class="adet">${r.items.map(it => esc(itemTxt(it))).join('<br>')}</div></div>`).join('') : ''}</div>`;

}

async function saveRuang(f, fd, rec, edit, id) {
  const nama = f.nama.trim(), username = (edit && rec.username ? rec.username : String(f.username || '').trim().toLowerCase());
  if (!USER_RE.test(username)) throw new Error('Username 3–30 karakter: huruf kecil, angka, titik, garis bawah, atau strip.');
  if (S.data.ruang.some(r => r.nama.toLowerCase() === nama.toLowerCase() && r.id !== id)) throw new Error('Nama ruang sudah ada.');
  const acc = await DB.get('akunRuang', username);
  if (acc && acc.ruangId !== id) throw new Error('Username sudah dipakai ruang lain.');
  let salt = acc ? acc.salt : '', hash = acc ? acc.hash : '';
  if (f.password) {
    if (f.password.length < 6) throw new Error('Password minimal 6 karakter.');
    salt = newSalt(); hash = await hashPw(f.password, salt);
  }
  if (!hash) throw new Error('Password wajib diisi.');
  const aktif = !!fd.get('aktif'), data = { nama, kelasBawaan: fd.getAll('kb'), username, aktif };
  let nid = id;
  if (edit) await DB.update('ruang', id, data); else nid = await DB.add('ruang', data);
  await DB.set('akunRuang', username, { ruangId: nid, ruangNama: nama, salt, hash, aktif });
  upsertLocal('ruang', { ...(edit ? rec : {}), ...data, id: nid });
  if (edit && nama !== rec.nama) await syncJadwal('ruangId', id, { ruangNama: nama });
  return nid;
}

const splitLines = text => text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
async function importSiswa(text) {
  const rows = []; let bad = 0;
  splitLines(text).forEach((l, i) => {
    const p = l.split(/[;\t,]/).map(x => x.trim());
    if (i === 0 && /^(nis|nomor|no\.?\s*peserta)/i.test(p[0])) return;
    if (p.length < 3 || !p[0] || !p[1] || !p[2]) { bad++; return; }
    rows.push({ nis: p[0], nama: p[1], kelas: p[2] });
  });
  if (!rows.length) throw new Error('Tidak ada baris valid. Format: NIS;Nama;Kelas');
  await ensureSiswa();
  const byNis = new Map(S.data.siswa.map(s => [s.nis, s.id]));
  const kn = new Set(S.data.kelas.map(k => k.nama));
  const newK = [...new Set(rows.map(r => r.kelas))].filter(k => !kn.has(k));
  if (newK.length) {
    const ids = await DB.setMany('kelas', newK.map(n => ({ data: { nama: n } })));
    newK.forEach((n, i) => S.data.kelas.push({ id: ids[i], nama: n }));
  }
  const m = new Map(); rows.forEach(r => m.set(r.nis, r));
  const items = [...m.values()].map(r => ({ id: byNis.get(r.nis) || null, data: r }));
  const ids = await DB.setMany('siswa', items);
  items.forEach((it, i) => upsertLocal('siswa', { ...it.data, id: ids[i] }));
  return { baru: items.filter(i => !i.id).length, ubah: items.filter(i => i.id).length, bad };
}
async function importPengawas(text) {
  const rows = []; let bad = 0;
  splitLines(text).forEach((l, i) => {
    const p = l.split(/[;\t]/).map(x => x.trim());
    if (i === 0 && /^nama\b/i.test(p[0])) return;
    if (!p[0]) { bad++; return; }
    rows.push({ nama: p[0], nip: (p[1] || '').replace(/\s+/g, '') });
  });
  if (!rows.length) throw new Error('Tidak ada baris valid. Format: Nama;NIP');
  const byNama = new Map(S.data.pengawas.map(p => [p.nama.toLowerCase(), p]));
  const m = new Map(); rows.forEach(r => m.set(r.nama.toLowerCase(), r));
  const items = [...m.values()].map(r => { const ex = byNama.get(r.nama.toLowerCase()); return { id: ex ? ex.id : null, data: { nama: r.nama, nip: r.nip || (ex && ex.nip) || '', aktif: ex ? ex.aktif !== false : true } }; });
  const ids = await DB.setMany('pengawas', items);
  items.forEach((it, i) => upsertLocal('pengawas', { ...it.data, id: ids[i] }));
  return { baru: items.filter(i => !i.id).length, ubah: items.filter(i => i.id).length, bad };
}
async function importRuang(text) {
  let baru = 0, ubah = 0, bad = 0;
  const kn = new Set(S.data.kelas.map(k => k.nama));
  for (const [i, l] of splitLines(text).entries()) {
    const p = l.split(/[;\t]/).map(x => x.trim());
    if (i === 0 && /^nama\b/i.test(p[0])) continue;
    const ex = S.data.ruang.find(r => r.nama.toLowerCase() === (p[0] || '').toLowerCase());
    const username = ex && ex.username ? ex.username : String(p[1] || '').toLowerCase();
    if (!p[0] || !USER_RE.test(username) || (!(ex && ex.username) && !p[2]) || (p[2] && p[2].length < 6)) { bad++; continue; }
    const acc = await DB.get('akunRuang', username);
    if (acc && (!ex || acc.ruangId !== ex.id)) { bad++; continue; }
    let salt = acc ? acc.salt : '', hash = acc ? acc.hash : '';
    if (p[2]) { salt = newSalt(); hash = await hashPw(p[2], salt); }
    const kb = p[3] ? p[3].split(/[|,]/).map(x => x.trim()).filter(x => kn.has(x)) : (ex ? ex.kelasBawaan || [] : []);
    const data = { nama: p[0], kelasBawaan: kb, username, aktif: ex ? ex.aktif !== false : true };
    let nid;
    if (ex) { await DB.update('ruang', ex.id, data); nid = ex.id; ubah++; } else { nid = await DB.add('ruang', data); baru++; }
    await DB.set('akunRuang', username, { ruangId: nid, ruangNama: data.nama, salt, hash, aktif: data.aktif });
    upsertLocal('ruang', { ...(ex || {}), ...data, id: nid });
  }
  if (!baru && !ubah) throw new Error('Tidak ada baris valid. Format: Nama ruang;Username;Password;Kelas bawaan');
  return { baru, ubah, bad };
}

      const mp = S.data.mapel.find(x => x.id === f.mapelId), jamKe = Number(f.jamKe), gids = new Set(grp.map(j => j.id));
      const clash = S.data.jadwal.filter(j => !gids.has(j.id) && j.tanggal === f.tanggal && j.jamKe === jamKe && ids.includes(j.ruangId));
      if (clash.length) throw new Error('Bentrok: ' + clash.slice(0, 5).map(j => j.ruangNama + ' (' + j.mapelNama + ')').join(', ') + (clash.length > 5 ? ', dll' : '') + ' sudah terjadwal pada tanggal dan jam ke-' + jamKe + ' tersebut.');
      const removed = grp.filter(j => !ids.includes(j.ruangId)), blocked = removed.filter(j => S.data.bap.some(b => b.id === j.id));
      if (blocked.length) throw new Error('Ruang ' + blocked.map(j => j.ruangNama).join(', ') + ' sudah memiliki BAP dan tidak bisa dilepas. Hapus BAP-nya di Rekap terlebih dulu.');
      const base = { tanggal: f.tanggal, jamKe, jamMulai: f.jamMulai, jamSelesai: f.jamSelesai, mapelId: mp.id, mapelNama: mp.nama };
      await withLoad(async () => {
        for (const j of removed) { await DB.del('jadwal', j.id); S.data.jadwal = S.data.jadwal.filter(x => x.id !== j.id); }
        const keep = grp.filter(j => ids.includes(j.ruangId));
        for (const j of keep) { await DB.update('jadwal', j.id, base); upsertLocal('jadwal', { ...j, ...base }); }
        const have = new Set(keep.map(j => j.ruangId));
        const add = ids.filter(id => !have.has(id)).map(id => { const rg = S.data.ruang.find(x => x.id === id); return { data: { ...base, ruangId: rg.id, ruangNama: rg.nama } }; });
        const nids = await DB.setMany('jadwal', add);
        add.forEach((a, i) => upsertLocal('jadwal', { ...a.data, id: nids[i] }));
      });
      closeModal(); render(); toast(`Jadwal tersimpan untuk ${ids.length} ruang.`);
    }
  });
}
function deleteJadwal(key) {
  const grp = grpOf(key); if (!grp.length) return;
  if (grp.some(j => S.data.bap.some(b => b.id === j.id))) { toast('Sebagian ruang pada jadwal ini sudah memiliki BAP. Hapus BAP-nya di Rekap terlebih dulu, atau lepas ruang lewat Ubah.', 'err'); return; }
  confirmBox(`Hapus jadwal ${grp[0].mapelNama} untuk ${grp.length} ruang?`, async () => {
    await withLoad(async () => { for (const j of grp) await DB.del('jadwal', j.id); });
    const ids = new Set(grp.map(j => j.id)); S.data.jadwal = S.data.jadwal.filter(j => !ids.has(j.id)); render(); toast('Jadwal dihapus.');
  }, 'Hapus');
}

  const side = `<aside class="side"><div class="sbrand">${logoImg(40)}<div><b>BAP Ujian</b><small>${esc(S.data.settings.nama || '')}</small></div></div>${nav.map(n => `<button class="sn ${S.page === n[0] ? 'on' : ''}" data-act="go" data-v="${n[0]}">${ic(n[2])}<span>${n[1]}</span></button>`).join('')}<div class="sfoot"><div class="uchip"><div class="av">${esc(initial(u.nama))}</div><div><b>${esc(u.nama)}</b><small>${u.role === 'admin' ? 'Administrator' : 'Ruang ujian'}</small></div></div><button class="sn" data-act="logout">${ic('logout')}<span>Keluar</span></button></div></aside>`;
  r.innerHTML = `${bannerHtml()}<div class="shell">${side}<main class="main" id="main"><div class="wrap">${v}</div></main></div>${bnav()}`;
  if (S.page === 'bap' && S.form) initPads();
}
async function go(p) {
  closeModal(); S.page = p;
  if (p === 'master' && ['siswa', 'kelas'].includes(S.ui.mtab)) await ensureSiswa();
  render(); const m = $('#main'); if (m) m.scrollTop = 0;
}
async function startSession() {
  await withLoad(loadData);
  S.page = S.user.role === 'admin' ? 'dash' : 'home'; render();
}

/* ================= EVENTS ================= */
const ACT = {
  ltab: t => { S.ui.ltab = t.dataset.v; render(); },
  go: t => guard(() => { S.form = null; return go(t.dataset.v); }),
  logout: () => guard(() => logout()),
  mclose: () => closeModal(),
  'mclose-bg': (t, e) => { if (e.target === t) closeModal(); },
  mok: async () => { const f = S.modal && S.modal.ok; closeModal(); if (f) await f(); },
  mtab: async t => { S.ui.mtab = t.dataset.v; S.ui.msearch = ''; S.ui.mkelas = ''; await go('master'); },
  madd: () => openMaster(S.ui.mtab),
  medit: t => openMaster(S.ui.mtab, t.dataset.id),
  mdel: t => deleteMaster(t.dataset.id),
  mimport: () => openImport(),
  jmode: t => { S.ui.jmode = t.dataset.v; render(); },
  jadd: () => openJadwal(),
  jedit: t => openJadwal(t.dataset.k),
  jdel: t => deleteJadwal(t.dataset.k),
  chkall: t => { document.querySelectorAll('#ruangChk input').forEach(i => { i.checked = t.dataset.v === '1'; }); updRcount(); },
  rview: t => { const b = S.data.bap.find(x => x.id === t.dataset.id); if (b) viewBapModal(b); },
  rpdf: async t => { const b = S.data.bap.find(x => x.id === t.dataset.id); if (b) await pdfRun(() => makePdf(b)); },
  runlock: t => confirmBox('Buka kunci BAP ini agar ruang dapat mengubahnya kembali (status menjadi Draf)?', async () => {
    const id = t.dataset.id, b = S.data.bap.find(x => x.id === id); if (!b) return;
    const now = new Date().toISOString(); await DB.update('bap', id, { status: 'draf', diubahPada: now });
    upsertLocal('bap', { ...b, status: 'draf', diubahPada: now }); render(); toast('BAP dibuka kembali sebagai draf.');
  }, 'Buka kunci'),
  rdel: t => confirmBox('Hapus BAP ini secara permanen?', async () => {
    const id = t.dataset.id; await DB.del('bap', id); S.data.bap = S.data.bap.filter(x => x.id !== id); render(); toast('BAP dihapus.');
  }, 'Hapus'),
  dpdf: () => pdfRun(() => makeAbsenPdf(S.ui.dday, absenRows(S.ui.dday))),
  hpdf: t => { const d = t.dataset.v, rows = hRows().filter(b => b.tanggal === d); return pdfRun(() => makeHarianPdf(d, rows, S.user.nama)); },
  logodel: () => { S.ui.logoTmp = ''; const el = $('#logoPrev'); if (el) el.textContent = 'Belum ada'; },
  bopen: t => openBapForm(t.dataset.id),
  bback: () => guard(() => { S.form = null; render(); }),
  st: t => {
    const F = S.form; if (!F || F.status === 'final') return;
    const sid = t.dataset.sid, m = F.kehadiranMap[sid] || (F.kehadiranMap[sid] = { status: 'H', ket: '' });
    m.status = t.dataset.v; F.dirty = true; refreshSiswa();
  },
  pwtoggle: t => {
    const i = t.parentElement.querySelector('input'), show = i.type === 'password';
    i.type = show ? 'text' : 'password'; t.innerHTML = ic(show ? 'eyeoff' : 'eye', 18); t.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  },
  ktoggle: t => { const F = S.form; F.openK = F.openK || {}; F.openK[t.dataset.v] = !F.openK[t.dataset.v]; refreshSiswa(); },
  padclear: t => {
    const cv = document.querySelector('canvas.pad[data-pad="' + t.dataset.v + '"]'); if (cv) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    S.form[t.dataset.v] = ''; S.form.dirty = true;
  },
  dtoggle: t => {
    const key = t.dataset.v, cur = dOpen(key, t.dataset.d === '1'); S.ui.dopen[key] = !cur;
    const w = $('#main .wrap'); if (w) w.innerHTML = VIEWS.dash();
  },
  kdel: t => { const F = S.form; F.kelas = F.kelas.filter(k => k !== t.dataset.v); F.dirty = true; refreshKelas(); },
  bsave: () => saveBap(false),
  bfinal: () => saveBap(true),
  bpdf: async () => { const e = validateBap(false); if (e) { toast(e, 'err'); return; } await pdfRun(() => makePdf(collectBap())); }
};
const FORM = {
  login: async f => {
    const fd = Object.fromEntries(new FormData(f)), err = $('#lerr'), btn = f.querySelector('[type=submit]');
    err.hidden = true; S.ui.cfgErr = '';
    if (!IS_PREVIEW && (!fb || firebaseConfig.apiKey === 'API_KEY_ANDA')) { err.textContent = 'Konfigurasi Firebase belum diisi. Isi firebaseConfig pada kode lalu muat ulang.'; err.hidden = false; return; }
    btn.disabled = true;
    try {
      await withLoad(async () => { if (S.ui.ltab === 'admin') await loginAdmin(fd.email, fd.password); else await loginRuang(fd.username, fd.password); });
      await startSession();
    } catch (e) {
      if (!IS_PREVIEW && S.user && S.user.role === 'admin' && fb) { try { await fb.authM.signOut(fb.auth); } catch (x) { /* abaikan */ } }
      S.user = null; err.textContent = authMsg(e); err.hidden = false;
    } finally { btn.disabled = false; }
  },
  modal: async f => {
    const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
    try { await S.modal.submit(new FormData(f), f); } catch (e) { toast(authMsg(e), 'err'); } finally { if (btn) btn.disabled = false; }
  },
  settings: async f => {
    const fd = Object.fromEntries(new FormData(f)), btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const data = { nama: fd.nama.trim(), alamat: (fd.alamat || '').trim(), kota: (fd.kota || '').trim(), tahunAjaran: (fd.tahunAjaran || '').trim(), jenisUjian: fd.jenisUjian.trim(), kertas: fd.kertas === 'F4' ? 'F4' : 'A4', kepsek: (fd.kepsek || '').trim(), nipKepsek: (fd.nipKepsek || '').trim(), logo: S.ui.logoTmp !== null ? S.ui.logoTmp : (S.data.settings.logo || '') };
      await withLoad(() => DB.set('settings', 'sekolah', data));
      S.data.settings = { ...data, id: 'sekolah' }; S.ui.logoTmp = null; render(); toast('Pengaturan tersimpan.');
    } catch (e) { toast(authMsg(e), 'err'); } finally { btn.disabled = false; }
  }
};
const CHANGE = {
  mkelas: t => { S.ui.mkelas = t.value; $('#mlist').innerHTML = masterList(); },
  rf: t => { S.ui.rf[t.dataset.k] = t.value; $('#rlist').innerHTML = rekapList(); },
  hf: t => { S.ui.hf[t.dataset.k] = t.value; $('#hlist').innerHTML = riwayatList(); },
  dday: t => { S.ui.dday = t.value || todayStr(); render(); },
  rcnt: () => updRcount(),
  fjam: t => { S.form.jamKe = t.value; S.form.dirty = true; },
  fpeng: t => {
    const F = S.form; F.pengawasId = t.value; F.dirty = true;
    if (F.pengawas2Id === t.value) { F.pengawas2Id = ''; F.pengawas2 = ''; F.pengawas2Nip = ''; }
    const p2 = $('#selP2'); if (p2) p2.innerHTML = optsHtml(pengOpts(F.pengawas2Id, F.pengawas2, F.pengawasId), F.pengawas2Id, '— Tidak ada —');
    refreshTtd();
  },
  fpeng2: t => { const F = S.form; F.pengawas2Id = t.value; F.dirty = true; if (!t.value) { F.pengawas2 = ''; F.pengawas2Nip = ''; F.ttd2 = ''; } refreshTtd(); },
  kadd: async t => {
    const v = t.value; if (!v) return; const F = S.form;
    await withLoad(() => setKelas([...F.kelas, v])); F.dirty = true; refreshKelas();
  },
  impfile: t => {
    const file = t.files && t.files[0]; if (!file) return;
    const fr = new FileReader(); fr.onload = () => { const ta = $('#imptxt'); if (ta) ta.value = String(fr.result || ''); }; fr.readAsText(file);
  },
  logo: async t => {
    const file = t.files && t.files[0]; if (!file) return;
    try {
      S.ui.logoTmp = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 200 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.onerror = () => rej(new Error('File bukan gambar yang valid.')); img.src = fr.result; };
        fr.onerror = () => rej(new Error('Gagal membaca file.')); fr.readAsDataURL(file);
      });
      const el = $('#logoPrev'); if (el) el.innerHTML = `<img src="${esc(S.ui.logoTmp)}" alt="Logo">`;
    } catch (e) { toast(e.message, 'err'); }
  }
};
const report = e => toast((e && e.message) || 'Terjadi kesalahan.', 'err');
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  try { const r = fn(t, e); if (r && r.catch) r.catch(report); } catch (x) { report(x); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const h = FORM[f.dataset.form]; if (h) h(f).catch(report);
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.ch; if (!k || !CHANGE[k]) return;
  try { const r = CHANGE[k](t); if (r && r.catch) r.catch(report); } catch (x) { report(x); }
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.f; if (!f) return;
  const F = S.form;
  if (['mulai', 'selesai', 'catatan'].includes(f) && F) { F[f] = t.value; F.dirty = true; }
  else if (f === 'ket' && F) { const m = F.kehadiranMap[t.dataset.sid]; if (m) { m.ket = t.value; F.dirty = true; } }
  else if (f === 'msearch') { S.ui.msearch = t.value; $('#mlist').innerHTML = masterList(); }
  else if (f === 'jq') { S.ui.jq = t.value; $('#jlist').innerHTML = jadwalList(); }
  else if (f === 'rq') { S.ui.rf.q = t.value; $('#rlist').innerHTML = rekapList(); }
});

/* ================= PWA (1 file) ================= */
function registerSW() {
  try {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    const code = "const C='bap-shell-v2';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET'||r.mode!=='navigate')return;e.respondWith(fetch(r).then(res=>{const cp=res.clone();caches.open(C).then(c=>c.put(r,cp));return res}).catch(()=>caches.match(r)))});";
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    navigator.serviceWorker.register(url).catch(() => { /* beberapa browser menolak SW dari Blob; aplikasi tetap berjalan */ });
  } catch (e) { /* abaikan */ }
}

/* ================= BOOT ================= */
async function boot() {
  registerSW(); render();
  if (IS_PREVIEW) { try { await seedPreview(); S.data.settings = clone(MEM.settings.sekolah); render(); } catch (e) { S.ui.cfgErr = 'Mode preview gagal disiapkan: ' + e.message; render(); } return; }
  if (firebaseConfig.apiKey === 'API_KEY_ANDA') { S.ui.cfgErr = 'Konfigurasi Firebase belum diisi. Isi firebaseConfig pada kode lalu muat ulang.'; render(); return; }
  try {
    await withLoad(initFirebase);
    try { const br = await DB.get('settings', 'sekolah'); if (br) { S.data.settings = br; render(); } } catch (e) { /* logo login tidak termuat */ }
    const u = await new Promise(res => { const un = fb.authM.onAuthStateChanged(fb.auth, x => { un(); res(x); }); });
    if (u) { S.user = { role: 'admin', id: u.uid, nama: u.displayName || u.email, email: u.email }; await startSession(); }
  } catch (e) { S.user = null; S.ui.cfgErr = authMsg(e); render(); }
}
boot();
