const clean = o => { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; };
const DB = {
  async list(col, fl = []) {
    if (IS_PREVIEW) return Object.entries(MEM[col] || {}).map(([id, d]) => ({ ...clone(d), id })).filter(r => fl.every(([f, , v]) => r[f] === v));
    const { fs, db } = fb;
    const s = await fs.getDocs(fs.query(fs.collection(db, col), ...fl.map(([f, o, v]) => fs.where(f, o, v))));
    return s.docs.map(d => ({ ...d.data(), id: d.id }));
  },
  async get(col, id) {
    if (IS_PREVIEW) { const d = (MEM[col] || {})[id]; return d ? { ...clone(d), id } : null; }
    const { fs, db } = fb; const s = await fs.getDoc(fs.doc(db, col, id));
    return s.exists() ? { ...s.data(), id: s.id } : null;
  },
  async set(col, id, data) {
    const c = clean(data);
    if (IS_PREVIEW) { (MEM[col] = MEM[col] || {})[id] = c; return id; }
    await fb.fs.setDoc(fb.fs.doc(fb.db, col, id), c); return id;
  },
  async add(col, data) {
    const id = IS_PREVIEW ? uid() : fb.fs.doc(fb.fs.collection(fb.db, col)).id;
    return DB.set(col, id, data);
  },
  async update(col, id, data) {
    const c = clean(data);
    if (IS_PREVIEW) { Object.assign(MEM[col][id], c); return; }
    await fb.fs.updateDoc(fb.fs.doc(fb.db, col, id), c);
  },
  async del(col, id) {
    if (IS_PREVIEW) { delete MEM[col][id]; return; }
    await fb.fs.deleteDoc(fb.fs.doc(fb.db, col, id));
  },
  async setMany(col, items) {
    const ids = [];
    if (IS_PREVIEW) { for (const it of items) ids.push(await DB.set(col, it.id || uid(), it.data)); return ids; }
    const { fs, db } = fb;
    for (let i = 0; i < items.length; i += 400) {
      const b = fs.writeBatch(db);
      items.slice(i, i + 400).forEach(it => { const ref = it.id ? fs.doc(db, col, it.id) : fs.doc(fs.collection(db, col)); ids.push(ref.id); b.set(ref, clean(it.data)); });
      await b.commit();
    }
    return ids;
  }
};

}

/* ================= AUTH ================= */
async function hashPw(pw, salt) {
  if (!(window.crypto && crypto.subtle)) throw new Error('Browser tidak mendukung enkripsi. Buka aplikasi lewat HTTPS.');
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: 120000 }, k, 256);
  return b64(new Uint8Array(bits));
}
const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));

async function loginAdmin(email, pw) {
  email = String(email || '').trim();
  if (IS_PREVIEW) {
    if (email.toLowerCase() === 'admin@demo.sch' && pw === 'admin123') { S.user = { role: 'admin', id: 'demo', nama: 'Admin Demo', email }; return; }
    throw new Error('Email atau password salah.');
  }
  const c = await fb.authM.signInWithEmailAndPassword(fb.auth, email, pw);
  S.user = { role: 'admin', id: c.user.uid, nama: c.user.displayName || c.user.email, email: c.user.email };
}
async function loginPengawas(username, pw) {
  const id = String(username || '').trim().toLowerCase();
  if (!id || !pw) throw new Error('Isi username dan password.');
  if (!/^[a-z0-9._-]{3,30}$/.test(id)) throw new Error('Username atau password salah.');
  const acc = await DB.get('pengawas', id);
  if (!acc || acc.aktif === false || !acc.salt) throw new Error('Username atau password salah.');
  const h = await hashPw(pw, acc.salt);
  if (h !== acc.hash) throw new Error('Username atau password salah.');
  S.user = { role: 'pengawas', id, nama: acc.nama, nip: acc.nip || '' };
}
const authMsg = e => {
  const c = e && e.code ? e.code : '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Email atau password salah.';
  if (/too-many/.test(c)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if (/network/.test(c)) return 'Tidak ada koneksi internet.';
  if (/permission-denied/.test(String(e && e.message))) return 'Akses ditolak oleh Security Rules Firestore. Periksa pengaturan rules.';
  return (e && e.message) || 'Terjadi kesalahan.';
};

function sortData() {

  D.mapel.sort((a, b) => byName(a.nama, b.nama));

  D.siswa.sort((a, b) => byName(a.kelas + ' ' + a.nama, b.kelas + ' ' + b.nama));
  D.pengawas.sort((a, b) => byName(a.nama, b.nama));
  D.jadwal.sort((a, b) => (a.tanggal + (a.jamMulai || '')).localeCompare(b.tanggal + (b.jamMulai || '')));
  D.bap.sort((a, b) => (b.tanggal + (b.mulai || '')).localeCompare(a.tanggal + (a.mulai || '')));
}
async function loadData() {
  const D = S.data, u = S.user;
  const jobs = [
    DB.get('settings', 'sekolah').then(r => { D.settings = r || {}; }),
    DB.list('mapel').then(r => { D.mapel = r; }),
    DB.list('ruang').then(r => { D.ruang = r; }),
    DB.list('kelas').then(r => { D.kelas = r; })
  ];
  if (u.role === 'admin') {
    jobs.push(DB.list('pengawas').then(r => { D.pengawas = r; }), DB.list('jadwal').then(r => { D.jadwal = r; }), DB.list('bap').then(r => { D.bap = r; }));
  } else {
    jobs.push(DB.list('jadwal', [['pengawasId', '==', u.id]]).then(r => { D.jadwal = r; }), DB.list('bap', [['pengawasId', '==', u.id]]).then(r => { D.bap = r; }));

  await Promise.all(jobs);
  sortData();
}

      if (type === 'kelas' && S.data.kelas.some(k => k.nama.toLowerCase() === data.nama.toLowerCase())) throw new Error('Nama kelas sudah ada.');
      if (type === 'siswa') { await ensureSiswa(); if (S.data.siswa.some(s => s.nis === data.nis && s.id !== id)) throw new Error('NIS sudah terdaftar.'); }
      if (type === 'pengawas') {

        await DB.set('pengawas', nid, data);
      } else if (edit) await DB.update(type, id, data);
      else nid = await DB.add(type, data);
      upsertLocal(type, { ...(edit ? rec : {}), ...data, id: nid });
      closeModal(); render(); toast('Data tersimpan.');
    }
  });
}
function deleteMaster(id) {
  const type = S.ui.mtab, rec = S.data[type].find(x => x.id === id); if (!rec) return;
  const J = S.data.jadwal;

  if (used) { toast('Tidak dapat dihapus: masih dipakai pada jadwal atau data siswa.', 'err'); return; }

function openImport() {
  openModal('Impor Data Peserta', `<form data-form="modal"><p class="mut" style="margin-bottom:10px;font-size:13px">Satu siswa per baris dengan format <b>NIS;Nama;Kelas</b> (pemisah titik koma, koma, atau tab). Kelas baru dibuat otomatis. NIS yang sudah ada akan diperbarui.</p>
  <label class="fld"><span>Pilih file CSV / TXT (opsional)</span><input type="file" accept=".csv,.txt,text/csv,text/plain" data-ch="impfile"></label>

async function importSiswa(text) {
  const rows = [], bad = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((l, i) => {
    const p = l.split(/[;\t,]/).map(x => x.trim());
    if (i === 0 && /^(nis|nomor|no\.?\s*peserta)/i.test(p[0])) return;
    if (p.length < 3 || !p[0] || !p[1] || !p[2]) { bad.push(i + 1); return; }
    rows.push({ nis: p[0], nama: p[1], kelas: p[2] });
  });
  if (!rows.length) throw new Error('Tidak ada baris valid. Format: NIS;Nama;Kelas');
  await ensureSiswa();
  const byNis = new Map(S.data.siswa.map(s => [s.nis, s.id]));
  const kn = new Set(S.data.kelas.map(k => k.nama));
  const newK = [...new Set(rows.map(r => r.kelas))].filter(k => !kn.has(k));
  if (newK.length) {
    const ids = await DB.setMany('kelas', newK.map(n => ({ data: { nama: n } })));
    newK.forEach((n, i) => S.data.kelas.push({ id: ids[i], nama: n }));
  }
  const m = new Map(); rows.forEach(r => m.set(r.nis, r));
  const items = [...m.values()].map(r => ({ id: byNis.get(r.nis) || null, data: r }));
  const ids = await DB.setMany('siswa', items);
  items.forEach((it, i) => upsertLocal('siswa', { ...it.data, id: ids[i] }));
  return { baru: items.filter(i => !i.id).length, ubah: items.filter(i => i.id).length, bad: bad.length };
}

}
function siswaBox() {
  const F = S.form, ro = F.status === 'final';
  if (!F.kelas.length) return '<div class="empty">Pilih kelas untuk menampilkan daftar siswa.</div>';
  let tot = 0, hd = 0;

    rows.forEach(r => { if (((F.kehadiranMap[r.siswaId] || {}).status || 'H') === 'H') h++; });

  }).join('');

const refreshSiswa = () => { const el = $('#siswaBox'); if (el) el.innerHTML = siswaBox(); };
const refreshKelas = () => { const k = $('#kelasBox'); if (k) k.innerHTML = kelasBox(); refreshSiswa(); };
function collectBap() {
  const F = S.form, kehadiran = [], rekap = [];
  let tot = 0, hd = 0;
  for (const k of F.kelas) {
    const rows = F.siswaKelas[k] || []; let h = 0, t = 0;
    for (const r of rows) {
      const m = F.kehadiranMap[r.siswaId] || { status: 'H', ket: '' };
      kehadiran.push({ siswaId: r.siswaId, nis: r.nis, nama: r.nama, kelas: k, status: m.status, ket: m.status === 'H' ? '' : (m.ket || '').trim() });
      if (m.status === 'H') h++; else t++;
    }
    rekap.push({ kelas: k, seharusnya: rows.length, hadir: h, tidakHadir: t }); tot += rows.length; hd += h;
  }
  const rg = S.data.ruang.find(r => r.id === F.ruangId);
  return {
    jadwalId: F.jadwalId, tanggal: F.tanggal, mapelNama: F.mapelNama, ruangId: F.ruangId, ruangNama: rg ? rg.nama : '',
    kelas: [...F.kelas], rekapKelas: rekap, jumlahSeharusnya: tot, hadir: hd, tidakHadir: tot - hd, kehadiran,
    mulai: F.mulai, selesai: F.selesai, jumlahLJK: F.jumlahLJK === '' || F.jumlahLJK == null ? null : Number(F.jumlahLJK),
    catatan: (F.catatan || '').trim(), pengawasId: F.pengawasId, pengawasNama: F.pengawasNama, pengawasNip: S.user.nip || F.pengawasNip || '',
    pengawas2: (F.pengawas2 || '').trim(), status: F.status
  };
}
function validateBap(fin) {
  const F = S.form;
  if (!F.ruangId) return 'Pilih ruang ujian.';
  if (!F.kelas.length) return 'Pilih minimal satu kelas.';
  if (!fin) return '';
  if (!F.mulai || !F.selesai) return 'Isi jam mulai dan jam selesai.';
  if (F.selesai <= F.mulai) return 'Jam selesai harus setelah jam mulai.';
  if (F.jumlahLJK !== '' && Number(F.jumlahLJK) < 0) return 'Jumlah lembar jawaban tidak valid.';
  if (F.kelas.every(k => !(F.siswaKelas[k] || []).length)) return 'Kelas terpilih belum memiliki siswa.';
  return '';
}
async function saveBap(fin) {
  const F = S.form, err = validateBap(fin);
  if (err) { toast(err, 'err'); return; }
  const doSave = async () => {
    const prev = F.status; F.status = fin ? 'final' : 'draf';
    try {
      const b = collectBap(), now = new Date().toISOString();
      b.dibuatPada = F.dibuatPada || now; b.diubahPada = now;
      await withLoad(() => DB.set('bap', F.jadwalId, b));
      F.dibuatPada = b.dibuatPada; F.dirty = false;
      upsertLocal('bap', { ...b, id: F.jadwalId });
      toast(fin ? 'BAP difinalkan dan terkunci.' : 'Draf tersimpan.'); render();
    } catch (e) { F.status = prev; throw e; }
  };
  if (fin) confirmBox('Finalkan BAP ini? Setelah final, BAP terkunci dan hanya admin yang dapat membukanya kembali.', doSave, 'Finalkan'); else await doSave();
}
function guard(fn) {
  if (S.form && S.form.dirty && S.form.status !== 'final') confirmBox('Perubahan BAP belum disimpan dan akan hilang. Tetap keluar?', () => { S.form.dirty = false; fn(); }, 'Tetap keluar'); else fn();
}

const loaded = {};
function loadScript(src) {
  return loaded[src] || (loaded[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(new Error('Gagal memuat pustaka PDF. Periksa koneksi internet.')); };
    document.head.appendChild(s);
  }));
}
async function makePdf(b) {
  await loadScript(JSPDF); await loadScript(ATBL);
  const { jsPDF } = window.jspdf, st = S.data.settings || {};
  const doc = new jsPDF({ unit: 'mm', format: st.kertas === 'F4' ? [215, 330] : 'a4', orientation: 'portrait' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), mL = 20, mR = 20, cw = W - mL - mR;
  let y = 16;
  const need = h => { if (y + h > H - 16) { doc.addPage(); y = 20; } };
  const tableBase = { theme: 'grid', margin: { left: mL, right: mR }, styles: { font: 'times', fontSize: 10.5, lineColor: [0, 0, 0], lineWidth: 0.2, textColor: 0, cellPadding: 1.8 }, headStyles: { fillColor: [255, 255, 255], textColor: 0, fontStyle: 'bold', halign: 'center' } };

  if (st.logo) { try { doc.addImage(st.logo, 'PNG', mL, y - 1, 22, 22); } catch (e) { /* logo diabaikan */ } }
  doc.setFont('times', 'bold'); doc.setFontSize(14);
  doc.text(String(st.nama || 'NAMA SEKOLAH').toUpperCase(), W / 2, y + 6, { align: 'center' });
  doc.setFont('times', 'normal'); doc.setFontSize(10);
  const al = doc.splitTextToSize(st.alamat || '', cw - 50);
  doc.text(al, W / 2, y + 12, { align: 'center' });
  y = Math.max(y + 13 + al.length * 4.5, y + 24);
  doc.setLineWidth(0.8); doc.line(mL, y, W - mR, y); doc.setLineWidth(0.2); doc.line(mL, y + 1.2, W - mR, y + 1.2);
  y += 9;

  doc.setFont('times', 'bold'); doc.setFontSize(12);
  doc.text('BERITA ACARA PELAKSANAAN ' + String(st.jenisUjian || 'UJIAN').toUpperCase(), W / 2, y, { align: 'center' }); y += 5.5;
  if (st.tahunAjaran) { doc.text('TAHUN PELAJARAN ' + st.tahunAjaran, W / 2, y, { align: 'center' }); y += 5.5; }
  y += 4;

  const d = parseD(b.tanggal);
  const narasi = `Pada hari ini ${HARI[d.getDay()]}, tanggal ${d.getDate()} bulan ${BULAN[d.getMonth()]} tahun ${d.getFullYear()}, telah diselenggarakan ${st.jenisUjian || 'ujian'} mata pelajaran ${b.mapelNama} di ${st.nama || 'sekolah'} dari pukul ${b.mulai} sampai dengan pukul ${b.selesai} WIB, dengan rincian sebagai berikut:`;
  doc.setFont('times', 'normal'); doc.setFontSize(11);
  const nl = doc.splitTextToSize(narasi, cw);
  doc.text(narasi, mL, y, { maxWidth: cw, align: 'justify' }); y += nl.length * 5 + 3;

  doc.autoTable({
    startY: y, theme: 'plain', margin: { left: mL, right: mR }, styles: { font: 'times', fontSize: 11, cellPadding: { top: 0.8, bottom: 0.8, left: 0, right: 1 }, textColor: 0 },
    columnStyles: { 0: { cellWidth: 62 }, 1: { cellWidth: cw - 62 } },
    body: [['Ruang ujian', ': ' + b.ruangNama], ['Kelas', ': ' + (b.kelas || []).join(', ')], ['Jumlah peserta seharusnya', `: ${b.jumlahSeharusnya} orang`], ['Jumlah peserta hadir', `: ${b.hadir} orang`], ['Jumlah peserta tidak hadir', `: ${b.tidakHadir} orang`], ['Jumlah lembar jawaban', `: ${b.jumlahLJK == null ? '-' : b.jumlahLJK + ' lembar'}`]]
  });
  y = doc.lastAutoTable.finalY + 5;

  if ((b.rekapKelas || []).length > 1) {
    need(30);
    doc.autoTable({ ...tableBase, startY: y, head: [['Kelas', 'Seharusnya', 'Hadir', 'Tidak Hadir']], body: [...b.rekapKelas.map(r => [r.kelas, String(r.seharusnya), String(r.hadir), String(r.tidakHadir)]), ['Total', String(b.jumlahSeharusnya), String(b.hadir), String(b.tidakHadir)]], columnStyles: { 0: { halign: 'left' }, 1: { halign: 'center' }, 2: { halign: 'center' }, 3: { halign: 'center' } } });
    y = doc.lastAutoTable.finalY + 6;
  }

  need(24);
  doc.setFont('times', 'bold'); doc.setFontSize(11); doc.text('Peserta yang tidak hadir:', mL, y); y += 3;
  const tdh = (b.kehadiran || []).filter(r => r.status !== 'H');
  if (tdh.length) {
    doc.autoTable({ ...tableBase, startY: y, head: [['No', 'NIS', 'Nama', 'Kelas', 'Keterangan']], body: tdh.map((r, i) => [String(i + 1), String(r.nis), r.nama, r.kelas, LBL[r.status] + (r.ket ? ' – ' + r.ket : '')]), columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 26 }, 3: { cellWidth: 20, halign: 'center' } } });
    y = doc.lastAutoTable.finalY + 6;
  } else { doc.setFont('times', 'italic'); doc.text('Nihil (seluruh peserta hadir).', mL, y + 5); y += 11; }

  need(30);
  doc.setFont('times', 'bold'); doc.text('Catatan selama pelaksanaan ujian:', mL, y); y += 5.5;
  doc.setFont('times', 'normal');
  const cl = doc.splitTextToSize(b.catatan || 'Tidak ada catatan khusus. Ujian berjalan dengan lancar.', cw);
  cl.forEach(line => { need(6); doc.text(line, mL, y); y += 5; });
  y += 4;

  need(14);
  const pen = doc.splitTextToSize('Demikian berita acara ini dibuat dengan sebenarnya untuk dipergunakan sebagaimana mestinya.', cw);
  doc.text(pen, mL, y); y += pen.length * 5 + 6;

  need(95);
  const cxL = mL + cw * 0.25, cxR = mL + cw * 0.75, ul = (txt, x, yy) => { const w = doc.getTextWidth(txt); doc.line(x - w / 2, yy + 0.8, x + w / 2, yy + 0.8); };
  doc.text(`${st.kota ? st.kota + ', ' : ''}${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`, cxR, y, { align: 'center' }); y += 6;
  doc.text('Pengawas 1', cxL, y, { align: 'center' }); doc.text('Pengawas 2', cxR, y, { align: 'center' }); y += 22;
  doc.setFont('times', 'bold');
  doc.text(b.pengawasNama || '', cxL, y, { align: 'center' }); ul(b.pengawasNama || '', cxL, y);
  if (b.pengawas2) { doc.text(b.pengawas2, cxR, y, { align: 'center' }); ul(b.pengawas2, cxR, y); } else doc.text('(................................)', cxR, y, { align: 'center' });
  doc.setFont('times', 'normal');
  if (b.pengawasNip) doc.text('NIP. ' + b.pengawasNip, cxL, y + 5, { align: 'center' });
  y += 16;
  doc.text('Mengetahui,', W / 2, y, { align: 'center' }); y += 5.5; doc.text('Kepala Sekolah', W / 2, y, { align: 'center' }); y += 22;
  doc.setFont('times', 'bold');
  const ks = st.kepsek || '(................................)';
  doc.text(ks, W / 2, y, { align: 'center' }); if (st.kepsek) ul(ks, W / 2, y);
  doc.setFont('times', 'normal'); if (st.nipKepsek) doc.text('NIP. ' + st.nipKepsek, W / 2, y + 5, { align: 'center' });

  doc.save(`BAP_${safeName(b.mapelNama)}_${safeName(b.ruangNama)}_${b.tanggal}.pdf`);
}

      await withLoad(() => DB.set('settings', 'sekolah', data));
      S.data.settings = { ...data, id: 'sekolah' }; S.ui.logoTmp = null; render(); toast('Pengaturan tersimpan.');
    } catch (e) { toast(authMsg(e), 'err'); } finally { btn.disabled = false; }
  }
};
const CHANGE = {
  mkelas: t => { S.ui.mkelas = t.value; $('#mlist').innerHTML = masterList(); },
  rf: t => { S.ui.rf[t.dataset.k] = t.value; $('#rlist').innerHTML = rekapList(); },
  kadd: async t => {
    const v = t.value; if (!v) return; const F = S.form;
    await withLoad(() => setKelas([...F.kelas, v])); F.dirty = true; refreshKelas();
  },
  fruang: async t => {
    const F = S.form; F.ruangId = t.value; F.dirty = true;
    const r = S.data.ruang.find(x => x.id === t.value);
    if (r && r.kelasBawaan && r.kelasBawaan.length) await withLoad(() => setKelas(r.kelasBawaan.filter(n => S.data.kelas.some(k => k.nama === n))));
    refreshKelas();
  },
  impfile: t => {
    const file = t.files && t.files[0]; if (!file) return;
    const fr = new FileReader(); fr.onload = () => { const ta = $('#imptxt'); if (ta) ta.value = String(fr.result || ''); }; fr.readAsText(file);
  },
  logo: async t => {
    const file = t.files && t.files[0]; if (!file) return;
    try {
      S.ui.logoTmp = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 200 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.onerror = () => rej(new Error('File bukan gambar yang valid.')); img.src = fr.result; };
        fr.onerror = () => rej(new Error('Gagal membaca file.')); fr.readAsDataURL(file);
      });
      const el = $('#logoPrev'); if (el) el.innerHTML = `<img src="${esc(S.ui.logoTmp)}" alt="Logo">`;
    } catch (e) { toast(e.message, 'err'); }
  }
};
const report = e => toast((e && e.message) || 'Terjadi kesalahan.', 'err');
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  try { const r = fn(t, e); if (r && r.catch) r.catch(report); } catch (x) { report(x); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const h = FORM[f.dataset.form]; if (h) h(f).catch(report);
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.ch; if (!k || !CHANGE[k]) return;
  try { const r = CHANGE[k](t); if (r && r.catch) r.catch(report); } catch (x) { report(x); }
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.f; if (!f) return;
  const F = S.form;
  if (['mulai', 'selesai', 'jumlahLJK', 'catatan', 'pengawas2'].includes(f) && F) { F[f] = t.value; F.dirty = true; }
  else if (f === 'ket' && F) { const m = F.kehadiranMap[t.dataset.sid]; if (m) { m.ket = t.value; F.dirty = true; } }
  else if (f === 'msearch') { S.ui.msearch = t.value; $('#mlist').innerHTML = masterList(); }
  else if (f === 'rq') { S.ui.rf.q = t.value; $('#rlist').innerHTML = rekapList(); }
});

/* ================= PWA (1 file) ================= */
function registerSW() {
  try {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    const code = "const C='bap-shell-v1';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET'||r.mode!=='navigate')return;e.respondWith(fetch(r).then(res=>{const cp=res.clone();caches.open(C).then(c=>c.put(r,cp));return res}).catch(()=>caches.match(r)))});";
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    navigator.serviceWorker.register(url).catch(() => { /* beberapa browser menolak SW dari Blob; aplikasi tetap berjalan */ });
  } catch (e) { /* abaikan */ }
}

/* ================= BOOT ================= */
async function boot() {
  registerSW(); render();
  if (IS_PREVIEW) { try { await seedPreview(); } catch (e) { S.ui.cfgErr = 'Mode preview gagal disiapkan: ' + e.message; render(); } return; }
  if (firebaseConfig.apiKey === 'API_KEY_ANDA') { S.ui.cfgErr = 'Konfigurasi Firebase belum diisi. Isi firebaseConfig pada kode lalu muat ulang.'; render(); return; }
  try {
    await withLoad(initFirebase);
    const u = await new Promise(res => { const un = fb.authM.onAuthStateChanged(fb.auth, x => { un(); res(x); }); });
    if (u) { S.user = { role: 'admin', id: u.uid, nama: u.displayName || u.email, email: u.email }; await startSession(); }
  } catch (e) { S.user = null; S.ui.cfgErr = authMsg(e); render(); }
}
boot();
